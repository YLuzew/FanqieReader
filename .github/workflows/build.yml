name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Pub get
        run: flutter pub get

      - name: Analyze (report only)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Build debug APK
        continue-on-error: true
        run: flutter build apk --debug 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-apk
          path: |
            analyze.log
            build.log
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
